<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f1e7" />
    <title>The World Register</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <div class="masthead-bar">
          <button class="player-btn" id="playerBtn" title="Change players">
            <span class="avatar" id="playerAvatar">👤</span>
            <span id="playerName">Players</span>
          </button>
          <button class="reset-btn" id="resetBtn" title="Reset this deck">
            Reset deck
          </button>
        </div>
        <h1 class="masthead-title">The World Register</h1>
        <p class="masthead-motto">Of Capitals, Countries &amp; Flags</p>
        <div class="masthead-dateline">
          <span id="dateLine"></span>
          <span>Est. MMXXVI</span>
        </div>
      </header>
      <h2 class="section-title" id="deckTitle">US States</h2>

      <div class="deck-bar">
        <label class="deck-label" for="deckSelect">Deck</label>
        <select class="deck-select" id="deckSelect" aria-label="Choose a deck">
          <option value="states">US States</option>
          <optgroup label="World capitals">
            <option value="world">All countries</option>
            <option value="africa">Africa</option>
            <option value="asia">Asia</option>
            <option value="europe">Europe</option>
            <option value="northAmerica">North America</option>
            <option value="southAmerica">South America</option>
            <option value="oceania">Oceania</option>
          </optgroup>
        </select>
      </div>

      <div class="stats">
        <div
          class="stat mastered"
          data-cat="mastered"
          role="button"
          tabindex="0"
        >
          <div class="stat-num" id="masteredCount">0</div>
          <div class="stat-label">Mastered</div>
        </div>
        <div
          class="stat learning"
          data-cat="learning"
          role="button"
          tabindex="0"
        >
          <div class="stat-num" id="learningCount">0</div>
          <div class="stat-label">Learning</div>
        </div>
        <div class="stat new" data-cat="new" role="button" tabindex="0">
          <div class="stat-num" id="newCount">50</div>
          <div class="stat-label">New</div>
        </div>
      </div>

      <div class="card">
        <div class="turn" id="turnBanner" hidden></div>
        <img class="flag" id="flag" alt="" hidden />
        <div class="prompt">What is the capital of</div>
        <div class="state" id="stateName">—</div>
        <div class="name-note" id="nameNote"></div>
        <div class="streak-dots" id="streakDots"></div>

        <form id="answerForm" autocomplete="off">
          <input
            type="text"
            id="answerInput"
            placeholder="Type the capital…"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="words"
            spellcheck="false"
            enterkeyhint="go"
          />
          <div class="choices" id="choices" hidden></div>
          <div class="buttons" id="buttonRow">
            <button type="submit" class="action submit" id="submitBtn">
              Check
            </button>
            <button type="button" class="action dunno" id="dunnoBtn">
              I don't know
            </button>
          </div>
        </form>

        <div class="feedback" id="feedback"></div>
      </div>

      <div class="hint">Progress is saved on this device, for each player.</div>
    </div>

    <div
      class="modal-backdrop"
      id="modalBackdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal" role="document">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle">—</h2>
          <button class="modal-close" id="modalClose" aria-label="Close">
            ×
          </button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <div
      class="modal-backdrop"
      id="playersBackdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="playersTitle"
    >
      <div class="modal" role="document">
        <div class="modal-header">
          <h2 class="modal-title" id="playersTitle">Who is playing?</h2>
          <button class="modal-close" id="playersClose" aria-label="Close">
            ×
          </button>
        </div>
        <div class="modal-body">
          <p class="players-hint" id="playersHint"></p>
          <div class="player-list" id="playerList"></div>
          <form class="add-player" id="addPlayerForm" autocomplete="off">
            <div class="deck-label">New player</div>
            <input
              type="text"
              id="newPlayerName"
              placeholder="Name"
              maxlength="20"
              autocomplete="off"
              autocapitalize="words"
              spellcheck="false"
            />
            <div
              class="avatar-picker"
              id="avatarPicker"
              role="radiogroup"
              aria-label="Choose an animal"
            ></div>
            <button type="submit" class="action dunno">Add player</button>
          </form>
          <div class="start-row">
            <button type="button" class="action next" id="startBtn" disabled>
              Start
            </button>
            <button type="button" class="new-game-btn" id="newGameBtn" hidden>
              New game — delete all players
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal-backdrop confirm-backdrop"
      id="confirmBackdrop"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirmText"
    >
      <div class="modal confirm" role="document">
        <p class="confirm-text" id="confirmText"></p>
        <div class="buttons">
          <button type="button" class="action dunno" id="confirmCancel">
            Cancel
          </button>
          <button type="button" class="action danger" id="confirmOk">
            OK
          </button>
        </div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
